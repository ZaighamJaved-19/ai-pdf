[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pdf-studio"
version = "0.1.0"
description = "Privacy-first PDF productivity services for AI PDF Studio"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
