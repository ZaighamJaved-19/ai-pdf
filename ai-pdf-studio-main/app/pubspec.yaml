name: ai_pdf_studio
description: Professional Windows workspace for AI PDF Studio.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  desktop_drop: ^0.8.0
  file_picker: ^12.1.3
  flutter:
    sdk: flutter
  pdfrx: ^1.0.75
  printing: ^5.13.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_markdown: ^0.7.4
  flutter_math_fork: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
